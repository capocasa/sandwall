name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: procbox-linux-amd64
            ext: tar.gz
          - os: macos-latest
            artifact: procbox-macos-universal
            ext: tar.gz
          - os: windows-latest
            artifact: procbox-windows-amd64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Build
        run: nim c --path:src -d:release -o:procbox src/procbox.nim

      - name: Build x86_64 and create universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mv procbox procbox-arm64
          rm -rf ~/.cache/nim/procbox_r
          nim c --path:src -d:release --passC:"-arch x86_64" --passL:"-arch x86_64" --cpu:amd64 -o:procbox-x86_64 src/procbox.nim
          lipo -create procbox-arm64 procbox-x86_64 -output procbox
          file procbox

      - name: Run tests
        run: nimble test

      - name: Package (Unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p ${{ matrix.artifact }}
          cp procbox ${{ matrix.artifact }}/
          cp README.md LICENSE ${{ matrix.artifact }}/
          tar czf ${{ matrix.artifact }}.${{ matrix.ext }} ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ${{ matrix.artifact }} | Out-Null
          Copy-Item procbox.exe ${{ matrix.artifact }}/
          Copy-Item README.md, LICENSE ${{ matrix.artifact }}/
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            procbox-linux-amd64.tar.gz \
            procbox-macos-universal.tar.gz \
            procbox-windows-amd64.zip
